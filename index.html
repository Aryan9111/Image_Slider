<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Image Slider</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Nepal</h1>
  <h2>Welcome to Nepal</h2>

  <div class="slider">
    <div class="track">
      <img src="images/slide1.jpeg" alt="Mountains at sunrise">
      <img src="images/slide2.jpg" alt="Lake at dusk">
      <img src="images/slide3.jpg" alt="Forest in mist">
      <img src="images/slide4.jpg" alt="Desert sunset">
      <img src="images/slide5.jpg" alt="Night sky">
    </div>

    <button class="arrow prev">&#10094;</button>
    <button class="arrow next">&#10095;</button>

    <!-- Dots are created by slider.js -->
    <div class="dots"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
